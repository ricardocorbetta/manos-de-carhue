<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#f7f5f4; --surface:#ffffff; --ink:#1f1716; --ink2:#5c5250; --muted:#8a7f7d; --line:#e6e0de; --track:#eee9e7;
  --brand:#AE1A1A; --good:#1c7a45; --goodbg:#e3f3e9; --warn:#a36a00; --warnbg:#fbf0d9; --bad:#c23b22; --badbg:#fbe5e0; --meta:#1f1716;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --fb:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#151110; --surface:#1f1a19; --ink:#f3eeed; --ink2:#c9bfbd; --muted:#9a8f8d; --line:#382f2d; --track:#2e2726;
  --brand:#E0605A; --good:#5cc98a; --goodbg:#16301f; --warn:#e5b04f; --warnbg:#342913; --bad:#f07a62; --badbg:#3a1c16; --meta:#f3eeed;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#151110; --surface:#1f1a19; --ink:#f3eeed; --ink2:#c9bfbd; --muted:#9a8f8d; --line:#382f2d; --track:#2e2726;
  --brand:#E0605A; --good:#5cc98a; --goodbg:#16301f; --warn:#e5b04f; --warnbg:#342913; --bad:#f07a62; --badbg:#3a1c16; --meta:#f3eeed;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}
#app{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:24px 60px;display:grid;gap:28px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;border-top:6px solid var(--brand);padding-top:16px}
.eyebrow{font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--brand);font-size:15px}
h1{font-family:var(--fd);font-weight:700;font-size:clamp(32px,5vw,44px);line-height:1;margin:2px 0 4px}
h2{font-family:var(--fd);font-weight:700;font-size:26px;margin:0;line-height:1.1}
h3{font-family:var(--fd);font-weight:600;font-size:19px;margin:0;line-height:1.2}
.sub{color:var(--ink2);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills button:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start}
.kpi .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .l{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600}
.kpi .v{font-family:var(--fd);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .m{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;background:var(--track);border-radius:99px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--meta);border-radius:1px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.good{color:var(--good);background:var(--goodbg)} .st.warn{color:var(--warn);background:var(--warnbg)} .st.bad{color:var(--bad);background:var(--badbg)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.col{display:grid;gap:12px}
.colhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rule .head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.rule .when{font-size:14px;color:var(--ink2)}

.rule .nums{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.rule .nums strong{color:var(--ink);font-size:18px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);background:var(--bg);font-weight:600}
tr:last-child td{border-bottom:0}
details.admin{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
details.admin summary{cursor:pointer;font-weight:700}
.admin .grid{display:grid;gap:16px;margin-top:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.fields input{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.msg{font-size:14px;color:var(--ink2)}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.note{font-size:13px;color:var(--ink2);display:grid;gap:4px}
.stale{margin-top:6px;display:inline-block;font-size:14px;font-weight:600;color:var(--warn);background:var(--warnbg);padding:3px 10px;border-radius:6px}
.proy{gap:14px}
.proyhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.proy .l{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600}
.proy .big .v{font-family:var(--fd);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.proy .big .m{font-size:16px;color:var(--ink2)}
.bar.tall{height:16px}
.proygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.proygrid>div{display:grid;gap:4px;align-content:start;border-left:3px solid var(--line);padding-left:12px}
.proygrid strong{font-size:18px;font-variant-numeric:tabular-nums}
.proygrid .st{justify-self:start}
.m{font-size:14px;color:var(--ink2)}
.nav{display:flex;gap:6px}
.nb{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-width:40px}
.nb[disabled]{opacity:.45;cursor:default}
.nb:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 8px;display:grid;gap:3px;align-content:start;background:var(--bg);min-width:0}
.day .dn{font-weight:700;font-size:14px}.day .dn span{font-weight:400;color:var(--ink2)}
.day .dv{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.day .dm,.day .dt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .st{justify-self:start;font-size:11px;padding:2px 7px}
.day.next .dv,.day.miss .dv{font-size:18px;color:var(--muted);padding-block:6px}
.day.today{border:2px solid var(--brand)} .day.today .dv{font-size:18px;color:var(--brand);padding-block:6px}
.day.miss .dv{color:var(--warn)}
.day.done.good{border-top:4px solid var(--good)} .day.done.warn{border-top:4px solid var(--warn)} .day.done.bad{border-top:4px solid var(--bad)}

.fields1{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.fields1 textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.hh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

td.dv{color:var(--bad);font-weight:600}

.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.goal .l,.otros .l{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600}

@media (max-width:640px){
 .huddle .tbl{overflow:visible;border:0;background:transparent}

}

table.wk td:first-child{white-space:normal;min-width:190px}

.modo button[aria-pressed="true"]{background:var(--brand);color:#fff}

.eqh{font-size:clamp(40px,8vw,64px)}

.eq-big.good{background:var(--goodbg);color:var(--good)} .eq-big.bad{background:var(--badbg);color:var(--bad)} .eq-big.neutral{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:20px}

.pw h3 .m{font-family:var(--fb);font-weight:400}
.plan>.pw{margin-bottom:4px}
.eq-obj2{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.eq-obj2 .eq-h2{margin:0}
.eq-objrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eq-objmsg{font-size:20px}
.eq-obj2 .bar.tall{height:22px}
.fields select,.fields input[type=text]{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fields .wide{grid-column:span 2}
@media (max-width:500px){.fields .wide{grid-column:auto}}
.eq-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.eq-tile{display:grid;gap:2px;border-radius:12px;padding:12px 14px;border:2px solid var(--line);background:var(--surface)}
.eq-tile.good{border-color:var(--good);background:var(--goodbg)} .eq-tile.warn{border-color:var(--warn);background:var(--warnbg)} .eq-tile.bad{border-color:var(--bad);background:var(--badbg)}
.eq-tile .l{font-size:14px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.eq-tile .tv{font-family:var(--fd);font-size:40px;font-weight:700;line-height:1.05}
.eq-tile .tm{font-size:16px;color:var(--ink2);font-weight:600}
.eq-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.eq-goals>div{display:grid;gap:2px}
.eq-goals .l{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.75}
.eq-goals b{font-family:var(--fd);font-size:32px;line-height:1.1}
:root[data-theme="dark"] .eq-goals{border-top-color:rgba(0,0,0,.2)}
.p7t input[type=number]{width:70px;font:inherit;font-size:15px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.p7t input[type=text]{width:130px;font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.p7t tr.closed td{color:var(--muted)}
.p7t select[disabled]{opacity:.4}
.eq-nota{font-size:22px;background:var(--warnbg);border-left:6px solid var(--warn);border-radius:10px;padding:14px 18px}

.p7t select{max-width:170px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:16px;color:var(--ink2)}
.chip svg{width:22px;height:22px}
.chip.fuego.on{background:#fff1e0;border-color:#f0a24a;color:#8a4300}
.chip.fuego.on svg{color:#e8702a;animation:flama 1.4s ease-in-out infinite}
.chip.medal.on{background:#fff7d6;border-color:#e2bd3c;color:#6b5200}
.chip.medal.on svg{color:#d9a500}
:root[data-theme="dark"] .chip.fuego.on,:root[data-theme="dark"] .chip.medal.on{background:#3a2a16;color:#ffd7a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.fuego.on,:root:not([data-theme="light"]) .chip.medal.on{background:#3a2a16;color:#ffd7a8}}
@keyframes flama{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
.eq-ic svg{width:44px;height:44px;color:#d9a500}
.shine{position:relative;display:inline-block;overflow:hidden;border-radius:6px}
.shine::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:brillo 3.2s ease-in-out infinite}
@keyframes brillo{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.eq-podio{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.eq-podio .eq-h2{margin:0}
.pod{display:grid;gap:10px}
.pod-row{display:grid;grid-template-columns:44px 120px 1fr 90px;align-items:center;gap:12px;font-size:19px}
.pod-pos{font-family:var(--fd);font-weight:700;font-size:24px;color:var(--ink2);text-align:center}
.crown svg{width:34px;height:34px;color:#d9a500}
.pod-name{font-weight:700}
.pod-bar{position:relative;height:18px;background:var(--track);border-radius:99px}
.pod-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--bar-muted)}
.pod-row.p1 .pod-bar i{background:linear-gradient(90deg,#e2b23c,#f5d36b)}
.pod-row.p2 .pod-bar i{background:linear-gradient(90deg,#9aa3ad,#c9d0d6)}
.pod-row.p3 .pod-bar i{background:linear-gradient(90deg,#b0703d,#d49a66)}
.pod-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--meta)}
.pod-pts{text-align:right;font-variant-numeric:tabular-nums}.pod-pts b{font-family:var(--fd);font-size:28px}
@media (max-width:560px){.pod-row{grid-template-columns:36px 1fr 70px;font-size:16px}.pod-bar{grid-column:1 / -1;grid-row:2}}
.niveles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nivel{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:16px}
.nivel .nv-ic svg{width:34px;height:34px}
.nivel.ok{border-style:solid;color:var(--ink)}
.nivel.bronce.ok{border-color:#c07a42;background:#fbeee3}.nivel.bronce.ok svg{color:#b0703d}
.nivel.plata.ok{border-color:#9aa3ad;background:#f0f2f4}.nivel.plata.ok svg{color:#8a939c}
.nivel.oro.ok{border-color:#e2b23c;background:#fff7d6}.nivel.oro.ok svg{color:#d9a500}
:root[data-theme="dark"] .nivel.ok{background:var(--surface)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nivel.ok{background:var(--surface)!important}}
.eq-foco{transition:transform .2s ease, box-shadow .2s ease}
.eq-foco:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.eq-dot.today .eq-dc,.day.today{animation:latido 2.2s ease-in-out infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(174,26,26,.0)}50%{box-shadow:0 0 0 6px rgba(174,26,26,.15)}}
.eq-tile{transition:transform .2s ease}.eq-tile:hover{transform:scale(1.02)}
canvas.confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){.shine::after,.chip.fuego.on svg,.eq-dot.today .eq-dc,.day.today{animation:none}.eq-foco,.eq-tile{transition:none}}

.userbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.salir{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:6px 12px;border-radius:99px;cursor:pointer}
.salir:hover{color:var(--bad)}
.salir:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.login{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--brand);border-radius:12px;padding:24px;display:grid;gap:14px}
.login-card h1{margin:0}
.login-card form{display:grid;gap:12px}
.login-card label{display:grid;gap:4px;font-size:14px;color:var(--ink2);font-weight:600}
.login-card input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.login-card input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.login-card .btn{font-size:17px;padding:12px}

}

  --brand:#e0605a; --meta:#f3e7d8; --good:#6cc487; --goodbg:#183020; --warn:#e5b04f; --warnbg:#342913; --bad:#f08a66; --badbg:#3a1d14;

:root[data-marca] .top{border-top:0;padding-top:0}

:root[data-marca] .eq-hoy .eq-num,:root[data-marca] .eq-hoy .eq-goals b{color:var(--chalk);letter-spacing:.01em}
